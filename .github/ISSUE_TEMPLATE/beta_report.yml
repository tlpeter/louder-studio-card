name: Real hardware test report
description: Record what actually worked on a physical speaker
labels: [beta report]
body:
  - type: input
    id: versions
    attributes:
      label: Dashboard, HA, integration and speaker firmware versions
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Brand and exact model (no serial number)
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Tested functions and results
      description: Include play/pause, skip, volume, mute, source, sound mode, power, seek, shuffle/repeat, grouping through HA, reconnection and idle behavior. Use pass/fail/not exposed/not tested per function. For ESPHome also EQ, mixer and trims; for MA live meters also silence/stale data. Do not include credentials or personal data.
    validations:
      required: true
