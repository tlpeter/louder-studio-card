name: Release
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Publish the tested commit only
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo 'Invalid release version'; exit 1; }
          TAG="v$VERSION"
          test -f "release-notes/$TAG.md"
          MAIN_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          test "$MAIN_SHA" = "$RELEASE_SHA" || { echo 'Newer main exists; skipping obsolete run'; exit 0; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo 'Release already exists'; exit 0; fi
          sha256sum louder-amplifier-card.js > SHA256SUMS.txt
          zip -q multiroom-audio-dashboard.zip louder-amplifier-card.js hacs.json README.md LICENSE
          FLAGS=(--latest)
          if [[ "$VERSION" == *-beta.* ]]; then FLAGS=(--prerelease --latest=false); fi
          gh release create "$TAG" louder-amplifier-card.js SHA256SUMS.txt multiroom-audio-dashboard.zip --target "$RELEASE_SHA" --title "Multiroom Audio Dashboard $VERSION" --notes-file "release-notes/$TAG.md" "${FLAGS[@]}"
